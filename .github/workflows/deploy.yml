name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/isa_cpanel/web/mydigitsign.com/public_html
            # Configure git to trust the directory to bypass security check
            git config --global --add safe.directory /home/isa_cpanel/web/mydigitsign.com/public_html

            # Initialize git if the server directory is not a git repository
            if [ ! -d ".git" ]; then
              echo "Initializing Git repository on server..."
              git init
            fi

            # Force re-link the remote origin
            git remote remove origin 2>/dev/null || true
            git remote add origin https://sidAli1993:${{ secrets.GH_PAT }}@github.com/sidAli1993/signflow.git
            
            # Fetch and reset to match remote exactly
            git fetch origin
            git reset --hard origin/main
            
            # Load Node environment
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            
            # Install and build
            npm install
            npm run build
            
            # Restart the PM2 process
            pm2 restart signflow
            pm2 save
